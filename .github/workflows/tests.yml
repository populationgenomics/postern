name: tests

on:
  pull_request:
    types: [opened, ready_for_review, synchronize]
  push:
    branches: [main]

jobs:
  pytest:
    # Skip draft PRs.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
      # The sandbox e2e tests need bubblewrap. ubuntu-latest is 24.04, which
      # restricts unprivileged user namespaces via AppArmor (bwrap symptom:
      # "loopback: Failed RTM_NEWADDR: Operation not permitted"); lift it — Cloud
      # Run gen2 (the deploy target) has no such restriction. The hatch e2e tests
      # run the guest against the host /usr with the *system* interpreter, so
      # grpcio must be importable there (the uv env that runs pytest is not bound
      # into the sandbox). --no-deps: grpcio core has no Python runtime deps, and
      # this avoids pip failing to upgrade Debian-managed packages.
      - run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap python3-pip
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo /usr/bin/python3 -m pip install --break-system-packages --no-deps grpcio
      - run: uv sync --locked --group test --python ${{ matrix.python-version }}
      - run: uv run pytest -q

  wheel:
    # The suite against the installed wheel rather than the source tree: the init
    # and launcher a default profile uses are the ones setup.py built into the wheel.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
      # As in the pytest job: bubblewrap, user namespaces, and grpcio for the
      # system interpreter the hatch e2e guests run against; venv for the root run.
      - run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap python3-pip python3-venv
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo /usr/bin/python3 -m pip install --break-system-packages --no-deps grpcio
      - run: tools/build_wheel.sh
      # Not an editable install, so `import postern` in the suite resolves to the wheel.
      - run: |
          uv venv --python 3.13
          uv pip install dist/*.whl pytest 'grpcio>=1.60'
          # Else conftest would build binaries and hide a lookup that misses the wheel's.
          .venv/bin/python -c 'from postern import _sandbox; assert _sandbox._PACKAGED_INIT.is_file() and _sandbox._PACKAGED_LAUNCH.is_file() and _sandbox._PACKAGED_LISTEN.is_file()'
          .venv/bin/python -m pytest -q
      # The uid-drop tests need root, which the job's user is not. Not from .venv:
      # /home/runner is 0750, and neither a uid-dropped process nor a root bwrap
      # (which drops CAP_DAC_READ_SEARCH) can reach an install under it.
      - run: |
          sudo /usr/bin/python3 -m venv /opt/postern-root
          sudo /opt/postern-root/bin/pip install -q dist/*.whl pytest
          sudo /opt/postern-root/bin/python -m pytest -q -p no:cacheprovider tests/test_launch_e2e.py tests/test_forward_e2e.py

  seccomp-drift:
    # The authoritative drift check: regenerate the blob from the syscall lists with
    # libseccomp and fail if the committed _seccomp.bpf / _seccomp.spec differ.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - run: |
          sudo apt-get update && sudo apt-get install -y python3 python3-seccomp
          python3 tools/gen_seccomp.py
      - name: Fail on drift
        run: |-
          if ! git diff --exit-code -- src/postern/_seccomp.bpf src/postern/_seccomp.spec; then
            echo '::error::_seccomp.bpf/_seccomp.spec are stale — run tools/gen_seccomp.sh and commit the result'
            exit 1
          fi
